# Manage structured logging

logging.structured.ecs.service.environment=Production

logging.structured.format.console=ecs

# Enable the actuator shutdown

management.endpoint.shutdown.enabled=true

management.endpoints.web.exposure.include=health,info,shutdown

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=never
server.error.include-path=always

spring.application.name=Spring-Boot-React-Learning
spring.application.version=0.1.0

spring.config.import=optional:classpath:secrets.properties

spring.mongodb.uri=mongodb+srv://${mongodb.uri.userid}:${mongodb.uri.password}@${mongodb.uri.domain}/${mongodb.uri.database}?retryWrites=true&w=majority

# Cross-origin resource sharing

spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=5400

spring.thymeleaf.cache=true
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.suffix=.html

spring.web.resources.static-locations=classpath:/static/
