<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en-us" th:with="pageTitle=${'E-Commerce Orders'}">
<head th:replace="~{fragments/header :: common-head(${pageTitle})}"></head>
<body class="pageCenteredBody">
  <div class="pageCentered">
    <h2 th:text="${pageTitle}">Unresolved Page Title</h2>

    <table class="dataTable">
      <thead>
        <tr>
          <th>Order Placed</th>
          <th>Ordered By</th>
          <th>Products</th>
          <th>Total</th>
          <th>Order ID</th>
          <th>Document ID</th>
          <th>Order Details</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="order : ${ordersList}">
          <td th:text="${@dateFormatter.format(order.orderDate)}"/>
          <td th:text="${@nameFormatter.format(order.firstName, order.lastName)}"/>
          <td th:text="${order.products.size()}"/>
          <td th:text="${@orderCostCalculator.calculateTotalCostAsMoney(order)}"/>
          <td th:text="${order.orderId}"/>
          <td th:text="${order.documentId}"/>
          <td><a th:href="@{/e-commerce/order-detail/(orderId=${order.orderId})}">...</a></td>
        </tr>
      </tbody>
    </table>

    <div style="margin-top: 2rem;">
      <nav class="navigationContainer">
        <ul class="navigationList">
          <li><a href="/e-commerce/">E-Commerce Home</a></li>
          <li><a href="/">React Learning Home</a></li>
        </ul>
      </nav>
    </div>
  </div>
</body>
</html>
